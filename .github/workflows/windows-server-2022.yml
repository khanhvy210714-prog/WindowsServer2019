name: Windows Server 2022 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable RDP & Ultimate Performance
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 | Out-Null
          $scheme = (powercfg -list | Select-String "Ultimate Performance" | ForEach-Object { $_.ToString().Split()[3] })
          if ($scheme) { powercfg -setactive $scheme }

          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name "PagingFiles" -Value "C:\pagefile.sys 0 0" -ErrorAction SilentlyContinue

      - name: Set TimeZone, Region & System Language
        run: |
          Set-TimeZone -Id "SE Asia Standard Time"
          Set-Culture -CultureInfo en-US
          Set-WinSystemLocale -SystemLocale en-US
          Set-WinHomeLocation -GeoId 242

      - name: Set Password
        run: |
          net user runneradmin Password12345!

      - name: Restore System Data & Profiles
        run: |
          if (-not (Test-Path "D:\data")) { New-Item -Path "D:\data" -ItemType Directory -Force }

          if (Test-Path "d_data_backup_2022.zip") {
            Expand-Archive -Path "d_data_backup_2022.zip" -DestinationPath "D:\data" -Force -ErrorAction SilentlyContinue
          }

          $chromePath = "$env:LOCALAPPDATA\Google\Chrome\User Data"
          if (Test-Path "chrome_profile_2022.zip") {
            Expand-Archive -Path "chrome_profile_2022.zip" -DestinationPath $chromePath -Force -ErrorAction SilentlyContinue
          }

      - name: Setup Tailscale (Hostname: github-win2022)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
          Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/quiet" -Wait
          $env:Path += ";C:\Program Files\Tailscale"

          if (Test-Path "tailscale_state_2022.zip") {
            Expand-Archive -Path "tailscale_state_2022.zip" -DestinationPath "C:\ProgramData\Tailscale" -Force -ErrorAction SilentlyContinue
          }

          tailscale up --authkey=$env:TAILSCALE_AUTHKEY --hostname=github-win2022 --accept-routes

      - name: Install Cloudflare WARP
        run: |
          Invoke-WebRequest -Uri "https://1111-releases.cloudflareclient.com/win/latest" -OutFile "warp.msi"
          Start-Process msiexec.exe -ArgumentList '/i warp.msi /quiet /norestart' -Wait
          $warpPath = "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (Test-Path $warpPath) {
            & $warpPath registration new
            & $warpPath connect
          }

      - name: Show Connection IP & TimeZone
        run: |
          $env:Path += ";C:\Program Files\Tailscale"
          Start-Sleep -Seconds 5
          $tailscale_ip = tailscale ip -4
          $public_ip = (Invoke-RestMethod -Uri "https://api.ipify.org")
          $currentTime = Get-Date
          Write-Host "=========================================="
          Write-Host "THỜI GIAN HIỆN TẠI (GMT+7): $currentTime"
          Write-Host "IP TAILSCALE WIN 2022: $tailscale_ip"
          Write-Host "IP PUBLIC (WARP): $public_ip"
          Write-Host "User: runneradmin | Pass: Password12345!"
          Write-Host "=========================================="

      - name: Keep Alive (350 phut)
        run: |
          $i = 0
          while ($i -lt 350) {
            Start-Sleep -Seconds 60
            $i++
          }

      - name: Backup Data Before Shutdown
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          Stop-Process -Name "chrome" -ErrorAction SilentlyContinue
          Stop-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          if (Test-Path "D:\data\*") { Compress-Archive -Path "D:\data\*" -DestinationPath "d_data_backup_2022.zip" -Force -ErrorAction SilentlyContinue }
          $chromePath = "$env:LOCALAPPDATA\Google\Chrome\User Data"
          if (Test-Path $chromePath) { Compress-Archive -Path "$chromePath\*" -DestinationPath "chrome_profile_2022.zip" -Force -ErrorAction SilentlyContinue }
          
          if (Test-Path "C:\ProgramData\Tailscale") { 
            Get-ChildItem -Path "C:\ProgramData\Tailscale\*" -Exclude "Logs" | Compress-Archive -DestinationPath "tailscale_state_2022.zip" -Force -ErrorAction SilentlyContinue 
          }

          if (Test-Path "*_2022.zip") {
            git add *_2022.zip
            git commit -m "Auto backup Win2022 data"
            git push
          }

      - name: Auto Trigger Next Workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh workflow run "windows-server-2022.yml" --repo "khanhvy210714-prog/WindowsServer2019" --ref main
