name: Windows 10 22H2 QEMU UEFI on Ubuntu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-win10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Desktop, QEMU, OVMF, VNC Server & Tailscale
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies x11vnc xvfb qemu-system-x86 qemu-utils ovmf wget curl
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-ubuntu-qemu --accept-routes || true

      - name: Launch Ubuntu Desktop VNC Server (:0 - Port 5900)
        run: |
          Xvfb :0 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:0 startxfce4 > /dev/null 2>&1 &
          sleep 2
          x11vnc -display :0 -forever -shared -rfbport 5900 -nopw > /dev/null 2>&1 &
          sleep 2

      - name: Restore System Disk
        run: |
          # Ghép lại các file đĩa bị chia nhỏ nếu có bản backup
          if ls win10_disk.tar.gz.part* 1> /dev/null 2>&1; then
            echo "Đang ghép và khôi phục đĩa Win 10 từ backup..."
            cat win10_disk.tar.gz.part* > win10_disk.tar.gz
            tar -xzf win10_disk.tar.gz
            touch win10_installed.flag
            rm -f win10_disk.tar.gz
          else
            echo "Chưa có backup, khởi tạo đĩa QCOW2 100GB mới..."
            qemu-img create -f qcow2 win10.qcow2 100G
          fi

      - name: Download Windows 10 ISO (Chỉ tải nếu chưa cài)
        run: |
          if [ ! -f "win10_installed.flag" ] && [ ! -f "win10.iso" ]; then
            echo "Đang tải ISO Windows 10 22H2..."
            wget -O win10.iso "https://software.download.prss.microsoft.com/dbazure/Win10_22H2_EnglishInternational_x64v1.iso?t=6f91b7b9-1478-44ff-a2bc-634b420ffa0f&P1=1788860392&P2=602&P3=2&P4=J80gTn3%2fJTQOtPF1ToKk0iQIurYfYEptAdeV6k8iemU%2bMTqBKP0LZbtZRy81GkMUCoeVQjvpPrBlOk6PS0LgyJU4AAyQtPePtOxyra4TkAyx1%2bhgP%2bRQ0GJOhSado25Uriws3HUq4wInDXbU4LhttRGg2X8c0xxCpKRnO2uMibeT9KUa2J6oxjAFcslpCuf7y1CIyZkEdJMEWeyCr7mmC4tHynfwREL%2fFNQZYz4sLhdAY18C2jX3ZAXQ7qJwujggKrJ6rUsZd33llmMpG5T1sqUJ1FNOqNbXP2UoUTo8HPii0CE%2fj8oSDNA36Tt0LoGAHKdzr%2b9WPF%2bJ1pc24Mzyvg%3d%3d"
          fi

      - name: Launch QEMU Windows 10 (:1 - Port 5901)
        run: |
          CDROM_ARG=""
          if [ -f "win10.iso" ] && [ ! -f "win10_installed.flag" ]; then
            CDROM_ARG="-drive file=win10.iso,media=cdrom,if=none,id=cdrom0 -device ide-cd,bus=ahci0.1,drive=cdrom0"
          fi

          OVMF_PATH=$(ls /usr/share/OVMF/OVMF_CODE*.fd /usr/share/ovmf/OVMF*.fd 2>/dev/null | head -n 1)

          sudo qemu-system-x86_64 \
            -enable-kvm -cpu max -smp 4 -m 8192 -vga virtio -boot order=d,menu=on \
            -drive if=pflash,format=raw,readonly=on,file=$OVMF_PATH \
            -device ahci,id=ahci0 \
            -drive file=win10.qcow2,format=qcow2,if=none,id=hda0 -device ide-hd,bus=ahci0.0,drive=hda0 \
            $CDROM_ARG \
            -device qemu-xhci,id=xhci -device usb-tablet,bus=xhci.0 \
            -net nic,model=e1000 -net user,hostfwd=tcp::3389-:3389 \
            -vnc 0.0.0.0:1 > /dev/null 2>&1 &
          sleep 3

      - name: Show Connection Info
        run: |
          sleep 5
          tailscale_ip=$(tailscale ip -4 || echo "Chưa kết nối Tailscale")
          echo "=========================================="
          echo "IP TAILSCALE UBUNTU HOST: $tailscale_ip"
          echo "1. VNC UBUNTU DESKTOP: $tailscale_ip:5900"
          echo "2. VNC QEMU WIN 10:    $tailscale_ip:5901"
          echo "3. RDP WINDOWS 10:     $tailscale_ip:3389"
          echo "=========================================="

      - name: Keep Alive & Auto-Backup
        run: |
          # Cho máy chạy 300 phút (~5 tiếng), sau đó tự ngắt để backup và trigger lại
          sleep 18000

      - name: Backup Disk Before Runner Expires
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          sudo pkill -f qemu-system-x86_64 || true
          sleep 5

          rm -f win10_disk.tar.gz*

          if [ -f "win10.qcow2" ]; then
            echo "Đang nén đĩa win10.qcow2..."
            tar -czf win10_disk.tar.gz win10.qcow2
            echo "Đang chia nhỏ file nén thành 40MB..."
            split -b 40M win10_disk.tar.gz win10_disk.tar.gz.part
            rm -f win10_disk.tar.gz
          fi

          touch win10_installed.flag

          git add win10_disk.tar.gz.part* win10_installed.flag || true
          git commit -m "Auto backup Win10 QEMU Disk" || true
          git push || true

      - name: Auto Trigger Next Workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "win10-qemu.yml" --repo "khanhvy210714-prog/WindowsServer2019" --ref main || true
